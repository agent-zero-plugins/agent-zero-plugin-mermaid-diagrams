<html>
<head><title>Mermaid Renderer</title></head>
<body>
<div style="display:none;"></div>

<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

mermaid.initialize({
  startOnLoad: false,
  theme: 'dark',
  securityLevel: 'loose',
  fontFamily: 'inherit',
  themeVariables: {
    darkMode: true,
    background: '#1e1e2e',
    primaryColor: '#89b4fa',
    primaryTextColor: '#cdd6f4',
    primaryBorderColor: '#585b70',
    lineColor: '#a6adc8',
    secondaryColor: '#74c7ec',
    tertiaryColor: '#313244'
  }
});

let renderCounter = 0;

// ── Zoom Modal State ──────────────────────────────────────────────
const modal = {
  overlay: null,
  scale: 1,
  minScale: 0.1,
  maxScale: 10,
  panX: 0,
  panY: 0,
  isPanning: false,
  startX: 0,
  startY: 0,
  startPanX: 0,
  startPanY: 0,
};

function openZoomModal(svgHtml) {
  if (modal.overlay) modal.overlay.remove();

  modal.scale = 1;
  modal.panX = 0;
  modal.panY = 0;
  modal.isPanning = false;

  const overlay = document.createElement('div');
  overlay.className = 'mermaid-zoom-overlay';
  overlay.innerHTML = `
    <div class="mermaid-zoom-toolbar">
      <button class="mermaid-zoom-btn" data-action="zoom-out" title="Zoom out">
        <span class="material-symbols-outlined">remove</span>
      </button>
      <span class="mermaid-zoom-level">100%</span>
      <button class="mermaid-zoom-btn" data-action="zoom-in" title="Zoom in">
        <span class="material-symbols-outlined">add</span>
      </button>
      <button class="mermaid-zoom-btn" data-action="zoom-reset" title="Reset zoom">
        <span class="material-symbols-outlined">fit_screen</span>
      </button>
      <button class="mermaid-zoom-btn mermaid-zoom-close" data-action="close" title="Close (Esc)">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="mermaid-zoom-viewport">
      <div class="mermaid-zoom-content">${svgHtml}</div>
    </div>
  `;

  document.body.appendChild(overlay);
  modal.overlay = overlay;

  const viewport = overlay.querySelector('.mermaid-zoom-viewport');
  const content = overlay.querySelector('.mermaid-zoom-content');
  const zoomLabel = overlay.querySelector('.mermaid-zoom-level');

  // Remove max-width constraint on SVG inside modal
  const svg = content.querySelector('svg');
  if (svg) {
    svg.style.maxWidth = 'none';
    // Mermaid renders the SVG with width="100%" and no height attribute. Inside the
    // flex-centered modal content (which has no intrinsic width), width:auto/height:auto
    // collapses the SVG to 0x0. Derive an explicit pixel size from the viewBox so the
    // SVG has a real box that the zoom transform can scale.
    const vb = (svg.getAttribute('viewBox') || '').split(/\s+/).map(Number);
    if (vb.length === 4 && vb[2] > 0 && vb[3] > 0) {
      svg.style.width = vb[2] + 'px';
      svg.style.height = vb[3] + 'px';
    } else {
      svg.style.width = 'auto';
      svg.style.height = 'auto';
    }
    svg.removeAttribute('width');
    svg.removeAttribute('height');
  }

  function updateTransform() {
    content.style.transform = `translate(${modal.panX}px, ${modal.panY}px) scale(${modal.scale})`;
    zoomLabel.textContent = `${Math.round(modal.scale * 100)}%`;
  }

  function zoomBy(delta, centerX, centerY) {
    const oldScale = modal.scale;
    modal.scale = Math.min(modal.maxScale, Math.max(modal.minScale, modal.scale * delta));
    // Zoom toward the pointer position
    if (centerX !== undefined && centerY !== undefined) {
      const rect = viewport.getBoundingClientRect();
      const px = centerX - rect.left - rect.width / 2;
      const py = centerY - rect.top - rect.height / 2;
      modal.panX = px - (px - modal.panX) * (modal.scale / oldScale);
      modal.panY = py - (py - modal.panY) * (modal.scale / oldScale);
    }
    updateTransform();
  }

  function closeModal() {
    overlay.remove();
    modal.overlay = null;
  }

  // Mouse wheel zoom
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    zoomBy(delta, e.clientX, e.clientY);
  }, { passive: false });

  // Pan with mouse drag
  viewport.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    modal.isPanning = true;
    modal.startX = e.clientX;
    modal.startY = e.clientY;
    modal.startPanX = modal.panX;
    modal.startPanY = modal.panY;
    viewport.style.cursor = 'grabbing';
    e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    if (!modal.isPanning) return;
    modal.panX = modal.startPanX + (e.clientX - modal.startX);
    modal.panY = modal.startPanY + (e.clientY - modal.startY);
    updateTransform();
  });

  window.addEventListener('mouseup', () => {
    if (modal.isPanning) {
      modal.isPanning = false;
      viewport.style.cursor = 'grab';
    }
  });

  // Toolbar buttons
  overlay.querySelectorAll('.mermaid-zoom-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const action = btn.dataset.action;
      if (action === 'zoom-in') zoomBy(1.3);
      else if (action === 'zoom-out') zoomBy(1 / 1.3);
      else if (action === 'zoom-reset') { modal.scale = 1; modal.panX = 0; modal.panY = 0; updateTransform(); }
      else if (action === 'close') closeModal();
    });
  });

  // Close on Escape
  const escHandler = (e) => {
    if (e.key === 'Escape') {
      closeModal();
      window.removeEventListener('keydown', escHandler);
    }
  };
  window.addEventListener('keydown', escHandler);

  // Close on overlay background click (not on content)
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });

  // Animate in
  requestAnimationFrame(() => overlay.classList.add('active'));
}

// ── Mermaid Rendering ─────────────────────────────────────────────
async function renderMermaidBlock(codeEl) {
  // Mark as processed immediately to avoid re-entry
  codeEl.setAttribute('data-mermaid-processed', 'true');

  const source = codeEl.textContent.trim();
  if (!source) return;

  const wrapperId = `mermaid-${Date.now()}-${renderCounter++}`;

  // Walk up to the outermost wrapper that messages.js creates:
  // code -> pre -> .code-block-wrapper -> .markdown-block-wrap
  const pre = codeEl.parentElement;
  const codeBlockWrapper = pre.closest('.markdown-block-wrap')
    || pre.closest('.code-block-wrapper')
    || pre;

  // Build replacement container
  const container = document.createElement('div');
  container.className = 'mermaid-diagram-container';

  try {
    const { svg } = await mermaid.render(wrapperId, source);
    container.innerHTML = `
      <div class="mermaid-rendered">${svg}</div>
      <div class="mermaid-actions">
        <button class="mermaid-zoom-open" title="Open in zoom viewer">
          <span class="material-symbols-outlined">zoom_in</span>
        </button>
        <button class="mermaid-toggle-source" title="Show/hide source">
          <span class="material-symbols-outlined">code</span>
        </button>
        <button class="mermaid-copy-source" title="Copy source">
          <span class="material-symbols-outlined">content_copy</span>
        </button>
      </div>
      <div class="mermaid-source" style="display:none;">
        <pre><code>${source.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>
      </div>
    `;

    // Click on rendered diagram opens zoom modal
    container.querySelector('.mermaid-rendered').addEventListener('click', () => {
      openZoomModal(svg);
    });
    container.querySelector('.mermaid-rendered').style.cursor = 'zoom-in';

    // Zoom button also opens modal
    container.querySelector('.mermaid-zoom-open').addEventListener('click', (e) => {
      e.stopPropagation();
      openZoomModal(svg);
    });

    // Toggle source visibility
    container.querySelector('.mermaid-toggle-source').addEventListener('click', () => {
      const src = container.querySelector('.mermaid-source');
      const isHidden = src.style.display === 'none';
      src.style.display = isHidden ? 'block' : 'none';
      const icon = container.querySelector('.mermaid-toggle-source .material-symbols-outlined');
      icon.textContent = isHidden ? 'code_off' : 'code';
    });

    // Copy source to clipboard
    container.querySelector('.mermaid-copy-source').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(source);
      } catch {
        // Fallback for non-HTTPS contexts
        const ta = document.createElement('textarea');
        ta.value = source;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      const btn = container.querySelector('.mermaid-copy-source .material-symbols-outlined');
      btn.textContent = 'check';
      setTimeout(() => { btn.textContent = 'content_copy'; }, 2000);
    });
  } catch (err) {
    // Show error inline with the original source
    const errMsg = (err.message || 'Invalid diagram').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    container.innerHTML = `
      <div class="mermaid-error">
        <span class="material-symbols-outlined">error</span>
        <span>Mermaid syntax error: ${errMsg}</span>
      </div>
      <pre class="mermaid-error-source"><code>${source.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>
    `;
    // Clean up any leftover render container mermaid may have injected
    const orphan = document.getElementById('d' + wrapperId);
    if (orphan) orphan.remove();
  }

  // Replace the original code block with the rendered diagram
  codeBlockWrapper.replaceWith(container);
}

function processMermaidBlocks(root = document) {
  const codeBlocks = root.querySelectorAll(
    'pre > code.language-mermaid:not([data-mermaid-processed])'
  );
  codeBlocks.forEach(renderMermaidBlock);
}

// Debounce helper to avoid processing during rapid DOM changes
let debounceTimer = null;
function debouncedProcess() {
  if (debounceTimer) clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => processMermaidBlocks(), 150);
}

// Watch for new chat messages being added to the DOM
const observer = new MutationObserver((mutations) => {
  let hasNewNodes = false;
  for (const mutation of mutations) {
    for (const node of mutation.addedNodes) {
      if (node.nodeType === Node.ELEMENT_NODE) {
        // Quick check: does this subtree contain a mermaid code block?
        if (node.querySelector && node.querySelector('code.language-mermaid:not([data-mermaid-processed])')) {
          hasNewNodes = true;
          break;
        }
        if (node.classList && node.classList.contains('language-mermaid') && !node.dataset.mermaidProcessed) {
          hasNewNodes = true;
          break;
        }
      }
    }
    if (hasNewNodes) break;
  }
  if (hasNewNodes) {
    debouncedProcess();
  }
});

// Start observing — use document.body as the root to catch all chat updates
observer.observe(document.body, { childList: true, subtree: true });

// Process any blocks already in the DOM
processMermaidBlocks();
</script>

<style>
/* ── Diagram Container ─────────────────────────────────────────── */
.mermaid-diagram-container {
  position: relative;
  margin: 8px 0;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  overflow: hidden;
}

.mermaid-rendered {
  padding: 16px;
  display: flex;
  justify-content: center;
  overflow-x: auto;
}

.mermaid-rendered svg {
  max-width: 100%;
  height: auto;
}

.mermaid-actions {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.mermaid-diagram-container:hover .mermaid-actions {
  opacity: 1;
}

.mermaid-actions button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(0, 0, 0, 0.5);
  cursor: pointer;
  color: rgba(255, 255, 255, 0.7);
  padding: 0;
  transition: all 0.2s ease;
}

.mermaid-actions button:hover {
  background: rgba(0, 0, 0, 0.7);
  border-color: rgba(255, 255, 255, 0.3);
  color: white;
}

.mermaid-actions .material-symbols-outlined {
  font-size: 16px;
}

.mermaid-source {
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(0, 0, 0, 0.2);
}

.mermaid-source pre {
  margin: 0;
  padding: 12px;
  overflow-x: auto;
}

.mermaid-source code {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.7);
  font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
}

.mermaid-error {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  color: #ff6b6b;
  font-size: 13px;
  background: rgba(255, 50, 50, 0.08);
  border-bottom: 1px solid rgba(255, 50, 50, 0.15);
}

.mermaid-error .material-symbols-outlined {
  font-size: 18px;
}

.mermaid-error-source {
  margin: 0;
  padding: 12px;
  overflow-x: auto;
  background: rgba(0, 0, 0, 0.2);
}

.mermaid-error-source code {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.5);
}

/* ── Zoom Modal Overlay ────────────────────────────────────────── */
.mermaid-zoom-overlay {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.mermaid-zoom-overlay.active {
  opacity: 1;
}

.mermaid-zoom-toolbar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 16px;
  background: rgba(30, 30, 46, 0.95);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  flex-shrink: 0;
  user-select: none;
}

.mermaid-zoom-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.06);
  cursor: pointer;
  color: rgba(255, 255, 255, 0.8);
  padding: 0;
  transition: all 0.15s ease;
}

.mermaid-zoom-btn:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.3);
  color: white;
}

.mermaid-zoom-btn .material-symbols-outlined {
  font-size: 18px;
}

.mermaid-zoom-close {
  position: absolute;
  right: 16px;
}

.mermaid-zoom-level {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.6);
  min-width: 48px;
  text-align: center;
  font-family: 'Fira Code', 'Cascadia Code', monospace;
  user-select: none;
}

.mermaid-zoom-viewport {
  flex: 1;
  overflow: hidden;
  cursor: grab;
  display: flex;
  align-items: center;
  justify-content: center;
}

.mermaid-zoom-content {
  transform-origin: center center;
  transition: none;
  will-change: transform;
}

.mermaid-zoom-content svg {
  max-width: none;
  display: block;
}
</style>
</body>
</html>
